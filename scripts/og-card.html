<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>OG card source — screenshot at 1200x630</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body { position: relative; display: flex; align-items: center; justify-content: center; }
    .og-halo {
      position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%);
      width: 640px; height: 640px; border-radius: 50%;
      background: radial-gradient(circle, rgba(197,165,90,.30) 0%, rgba(160,130,60,.12) 45%, transparent 70%);
      filter: blur(80px);
    }
    .og-ring { position: absolute; top: 50%; left: 50%; border: 1px dashed rgba(197,165,90,.28); border-radius: 50%; }
    .og-ring--1 { width: 980px; height: 980px; margin: -490px 0 0 -490px; transform: scaleY(.34) rotate(-6deg); }
    .og-ring--2 { width: 760px; height: 760px; margin: -380px 0 0 -380px; transform: scaleY(.5) rotate(14deg); }
    .og-dot { position: absolute; width: 10px; height: 10px; border-radius: 3px; transform: rotate(45deg);
      background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold-dark));
      border: 1px solid var(--color-gold); box-shadow: 0 0 16px rgba(197,165,90,.7); }
    .og-content { position: relative; text-align: center; z-index: 2; }
    .og-content img { width: 110px; height: auto; margin-bottom: 28px; }
    .og-name { font-family: var(--font-display); font-size: 92px; font-weight: 600; letter-spacing: .06em;
      color: var(--color-gold); text-transform: uppercase; line-height: 1; }
    .og-tag { font-family: var(--font-body); font-size: 30px; color: var(--color-text-on-dark); margin-top: 26px; }
    .og-tag span { color: var(--color-gold); }
    .og-url { position: absolute; bottom: 38px; left: 0; right: 0; text-align: center;
      font-family: var(--font-body); font-size: 18px; letter-spacing: .18em; text-transform: uppercase;
      color: var(--color-text-on-dark-muted); }
  </style>
</head>
<body>
  <div class="og-halo"></div>
  <div class="og-ring og-ring--1"></div>
  <div class="og-ring og-ring--2"></div>
  <div class="og-dot" style="top: 168px; left: 214px;"></div>
  <div class="og-dot" style="top: 452px; right: 196px;"></div>
  <div class="og-content">
    <img src="/assets/images/logo_wo_name_transparent.png" alt="">
    <div class="og-name">Soter Labs</div>
    <div class="og-tag">Trusted GovOps provider for the <span>Sky Ecosystem</span></div>
  </div>
  <div class="og-url">soterlabs.com</div>
</body>
</html>
